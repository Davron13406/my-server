# Render Blueprint: paid instances are required for always-on service and persistent database.
services:
  - type: web
    name: fitquest-api
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python init_db.py
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fitquest-db
          property: connectionString
      - key: DB_POOL_SIZE
        value: "5"

databases:
  - name: fitquest-db
    plan: 0.1c-256mb
    databaseName: fitquest
    user: fitquest
    postgresMajorVersion: "16"
